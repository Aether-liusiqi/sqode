name: snapshot-linux

# Verification lane for the recorded-session corpus.
#
# The repository's `ci.yml` runs these gates on a self-hosted runner pool and only
# for pull requests, so a change to pinned goldens cannot be checked from a
# workstation that is not on that pool: the Windows host cannot replay the corpus
# at all, because the bash tool is disabled there by design.
#
# Two modes, both on a GitHub-hosted Ubuntu runner:
#   verify  - compare as CI does; a red run is the answer to "does it match?"
#   refresh - rewrite the expected outputs and upload the resulting diff as an
#             artifact, so the change can be reviewed as a patch on a machine that
#             cannot produce it. Refresh never commits anything by itself.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Rewrite goldens on Linux and upload the diff (review it before committing)
        type: boolean
        default: false
      web:
        description: Also run the browser snapshot lane
        type: boolean
        default: false
      record:
        description: Re-record web fixtures against a live model (needs DEEPSEEK_API_KEY) and upload the diff
        type: boolean
        default: false
      record_filter:
        description: Test-name filter for the record lane, so one scenario is re-recorded instead of all of them
        type: string
        default: code-language

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  SQODE_TELEMETRY_DISABLED: '1'
  SQODE_BUILD_FACE: official
  SQODE_EXAMPLE_MODE: lib
  # The web lane refuses to start without a worker count, and this workflow does not
  # go through run-gates, which normally derives it from the host.
  SQODE_WEB_SNAPSHOT_WORKERS: '4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: recorded corpus / linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      # The corpus drives real commands, and the sandbox refuses to run them
      # unconfined: without a usable backend every tool call fails with "no sandbox
      # backend is usable on this host", which the recorded outputs never expect.
      # ci.yml prepares the same backend alongside its install step.
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      # A hosted runner builds this tree in a few minutes. The cap turns a wedged
      # tsc/tsdown into a fast, named failure instead of an hour of silence: the job
      # otherwise sits there until its own 90-minute limit with no output to read.
      - name: Build
        timeout-minutes: 30
        run: pnpm run build

      # The CLI entry point does not exist until the build writes it, so the install
      # step warns "failed to create bin ... ENOENT ... apps/cli/lib/bin.js" and never
      # links `sqode` into node_modules/.bin. Every SDK replay spawns that command, so
      # all of them fail to start. Relinking after the build creates the link.
      # The CLI entry point does not exist until the build writes it, so the install
      # step warns "failed to create bin ... ENOENT ... apps/cli/lib/bin.js" and never
      # links the command. Re-installing does not repair that (it reports the tree as
      # up to date, and --force did not help either), so the link is created directly
      # and then proven by invoking it: an SDK replay that cannot spawn this command
      # fails in milliseconds with ENOENT, which reads like a test failure.
      - name: Ensure the CLI command is linked
        run: |
          chmod +x apps/cli/lib/bin.js
          # The install step tried to link this command in each dependent package
          # and could not, because the entry point only exists once the build has
          # written it. A replay resolves the command from its own package first,
          # so linking only the repository root is not enough: the three packages
          # that declare the bin get a link too.
          for dir in . apps/desktop-host apps/cli packages/sdk/client python/sdk-runtime; do
            mkdir -p "$dir/node_modules/.bin"
            for name in sqode dsh; do
              ln -sf "$PWD/apps/cli/lib/bin.js" "$dir/node_modules/.bin/$name"
            done
          done
          ls -l packages/sdk/client/node_modules/.bin/sqode
          node_modules/.bin/sqode --version

      # The snapshot suite always includes the browser scenarios, in a refresh and in a
      # verify alike, so the browsers are not conditional: a run without them fails in
      # the suite with "Executable doesn't exist". WebKit is required too, because the
      # web cases declare it, and the install finishes well before the suite only if it
      # starts this early. The existence check makes a partial install a named failure
      # rather than a scenario error 27 seconds later.
      - name: Install Playwright browsers
        run: |
          pnpm --filter @liusiqi-dev/dsh-web-frontend exec playwright install --with-deps chromium webkit
          test -d "$HOME/.cache/ms-playwright" || { echo 'playwright browsers are missing' >&2; exit 1; }
          ls -1 "$HOME/.cache/ms-playwright"

      # A refresh run rewrites files, so individual scenario failures are expected
      # while the corpus converges; the job still fails afterwards so a red result
      # is never mistaken for a green one.
      - name: Rewrite expected outputs
        if: ${{ inputs.refresh }}
        continue-on-error: true
        env:
          SQODE_SNAPSHOT: refresh
        run: pnpm run test:snapshot

      # Replay compares against a recorded script, so a scenario whose model-call count
      # drifted cannot be repaired by refresh: only a new recording replaces the script.
      # The harness self-skips real-model cases when the key is absent, which would look
      # like a quiet success, so a record run without the key fails here instead.
      - name: Record web fixtures against a live model
        if: ${{ inputs.record }}
        continue-on-error: true
        env:
          SQODE_SNAPSHOT: record
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RECORD_FILTER: ${{ inputs.record_filter }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo 'record needs DEEPSEEK_API_KEY in repository secrets' >&2; exit 1; }
          # Scoped on purpose: record overwrites the fixture of every scenario it runs,
          # so an unfiltered run would replace the whole web corpus on the strength of
          # one live conversation. The filter names one scenario; widen it deliberately.
          pnpm exec vitest run --config vitest.web.config.ts -t "$RECORD_FILTER"

      - name: Package the rewritten corpus
        if: ${{ inputs.refresh || inputs.record }}
        run: |
          mkdir -p "$RUNNER_TEMP/refresh"
          # A refresh also creates files: the v4 session logs are new paths, not edits.
          # Plain `git diff` omits untracked content, so the artifact carried the edited
          # expectations and silently left every new session log behind, which made the
          # patch unusable on the machine that received it. Staging first makes the new
          # files part of the diff.
          git add -A snapshots
          git diff --cached --binary -- snapshots > "$RUNNER_TEMP/refresh/snapshots.patch"
          git status --porcelain -- snapshots > "$RUNNER_TEMP/refresh/changed.txt"
          wc -l "$RUNNER_TEMP/refresh/snapshots.patch" "$RUNNER_TEMP/refresh/changed.txt"
          grep -c '^A' "$RUNNER_TEMP/refresh/changed.txt" || true

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.refresh || inputs.record }}
        with:
          name: snapshots-refresh
          path: ${{ runner.temp }}/refresh
          if-no-files-found: error

      - name: Compare recorded sessions and pinned prompts
        if: ${{ !inputs.refresh && !inputs.record }}
        run: pnpm run test:snapshot

      - name: Compare browser snapshots
        if: ${{ inputs.web && !inputs.refresh && !inputs.record }}
        env:
          SQODE_SNAPSHOT: replay
        run: pnpm run test:web:ci
