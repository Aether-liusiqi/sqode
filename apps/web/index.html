    <style>
      /* Sqode splash: pure CSS, auto-hides after React mounts. */
      #sqh-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #2B2F36 0%, #0E1013 70%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        transition: opacity 500ms ease-out;
      }
      #sqh-splash.sqh-done { opacity: 0; pointer-events: none; }
      .sqh-splash-lockup { display: flex; flex-direction: column; align-items: center; }
      .sqh-splash-row {
        display: flex; flex-direction: row; align-items: center; gap: 20px;
        position: relative; padding-bottom: 24px;
      }
      .sqh-splash-mark {
        width: 140px; height: 140px;
        opacity: 0; transform: scale(0.85); transform-origin: center;
        animation: sqhMarkIn 600ms cubic-bezier(0.16,1,0.3,1) 100ms forwards;
      }
      @keyframes sqhMarkIn { to { opacity: 1; transform: scale(1); } }
      .sqh-splash-wordmark {
        display: flex;
        font-size: 64px; font-weight: 300; letter-spacing: 2px;
        background: linear-gradient(90deg, #ED6A39 0%, #FFB08A 25%, #FFFFFF 50%, #FFB08A 75%, #ED6A39 100%);
        background-size: 300% 100%;
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        /* The gradient IS the glyph paint here, so the entrance has to animate
           this element: a child opacity would leave the parent's clipped
           background on screen and the name would appear instantly. */
        opacity: 0; transform: scale(0.85); transform-origin: center;
        animation:
          sqhMarkIn 600ms cubic-bezier(0.16,1,0.3,1) 100ms forwards,
          sqhWordmarkFlow 3s linear 1500ms infinite;
      }
      @keyframes sqhWordmarkFlow { 0% { background-position: 300% 50%; } 100% { background-position: 0% 50%; } }
      .sqh-splash-wordmark span { display: inline-block; }
      .sqh-splash-beam {
        position: absolute; left: 38px; right: -10px; bottom: 0;
        height: 2px; border-radius: 2px; overflow: hidden;
        background: linear-gradient(90deg, transparent 0%, #ED6A39 20%, #FFB08A 50%, #ED6A39 80%, transparent 100%);
        opacity: 0; animation: sqhBeamFade 600ms ease-out 500ms forwards;
      }
      .sqh-splash-beam::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, #FFB08A, transparent);
        animation: sqhBeamSlide 3s linear 0s infinite;
      }
      @keyframes sqhBeamFade { to { opacity: 0.6; } }
      @keyframes sqhBeamSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        #sqh-splash *, #sqh-splash *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
      }
    </style>
