- name: '@liusiqi-dev/sqh-llm'
- name: '@liusiqi-dev/sqh-session'
- name: '@liusiqi-dev/sqh-session-projection'
- name: '@liusiqi-dev/sqh-system-prompt'
- name: '@liusiqi-dev/sqh-tools'
- name: '@liusiqi-dev/sqh-agent'
- name: '@liusiqi-dev/sqh-agent-loop'
  config:
    agents: []
- name: '@liusiqi-dev/sqh-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@liusiqi-dev/sqh-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@liusiqi-dev/sqh-llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
