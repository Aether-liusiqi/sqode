# Standalone minimal SDK application. Unlike the ordinary SDK profile, this
# bundle does not layer over sqhbase: this insert is the complete Cordis tree.
# User profile, home, and invocation patches still apply above it.

- insert:
    - id: sdk-app-startup
      name: '@liusiqi-dev/sqh-sdk-app'
      disabled: false
      config:
        profile: sdk-minimal

    - id: sdk-jsonrpc-server
      name: '@liusiqi-dev/sqh-sdk-jsonrpc-server'
      disabled: false
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false

    - id: deepseek-llm-api-extensions
      name: '@liusiqi-dev/sqh-deepseek-llm-api-extensions'
      disabled: false

    - id: session-log-deepseek
      name: '@liusiqi-dev/sqh-session-log-deepseek'
      disabled: false

    - id: plugin-package-inventory-deepseek
      name: '@liusiqi-dev/sqh-plugin-package-inventory-deepseek'
      disabled: false

    - id: llm-deepseek
      name: '@liusiqi-dev/sqh-llm-deepseek-api-key'
      disabled: false
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        defaultContextWindow: !!js Number(process.env.SQODE_CONTEXT_WINDOW ?? 1000000)
        streamIdleTimeoutMs: 172800000

    - id: sandbox
      name: '@liusiqi-dev/sqh-sandbox-local'
      disabled: false

    # Shared projection registry: sandbox-policy and terminal-bash fold
    # sandbox-mode state through its units and require it as a hard injection.
    - id: session-projection
      name: '@liusiqi-dev/sqh-session-projection'
      disabled: false

    - id: sandbox-policy
      name: '@liusiqi-dev/sqh-sandbox-policy'
      disabled: false
      config:
        mode: danger-full-access
        workspaceRoot: !!js process.cwd()

    - id: subprocess
      name: '@liusiqi-dev/sqh-subprocess-local'
      disabled: false

    - id: pty
      name: '@liusiqi-dev/sqh-terminal'
      disabled: false

    - id: terminal-bash
      name: '@liusiqi-dev/sqh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@liusiqi-dev/sqh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    # Keep the minimal agent kernel explicit: unlike sqhbase, this profile
    # owns each service row and omits every optional producer it does not use.
    - id: timer
      name: '@liusiqi-dev/cordis-plugin-timer'
      disabled: false

    - id: llm
      name: '@liusiqi-dev/sqh-llm'
      disabled: false

    - id: session
      name: '@liusiqi-dev/sqh-session'
      disabled: false

    - id: session-title
      name: '@liusiqi-dev/sqh-session-title'
      disabled: false
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: system-prompt
      name: '@liusiqi-dev/sqh-system-prompt'
      disabled: false
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.SQODE_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'

    - id: tools
      name: '@liusiqi-dev/sqh-tools'
      disabled: false

    - id: mcp-resources
      name: '@liusiqi-dev/sqh-mcp-resources'
      disabled: false

    - id: agent
      name: '@liusiqi-dev/sqh-agent'
      disabled: false

    - id: llm-retry
      name: '@liusiqi-dev/sqh-llm-retry'
      disabled: false

    - id: jobs
      name: '@liusiqi-dev/sqh-jobs-local'
      disabled: false

    - id: invariants
      name: '@liusiqi-dev/sqh-invariants'
      disabled: false

    - id: session-invariant
      name: '@liusiqi-dev/sqh-session/invariant'
      disabled: false

    - id: agent-invariant
      name: '@liusiqi-dev/sqh-agent/invariant'
      disabled: false

    - id: scope-invariant
      name: '@liusiqi-dev/sqh-scope/invariant'
      disabled: false

    - id: agent-loop-invariant
      name: '@liusiqi-dev/sqh-agent-loop/invariant'
      disabled: false

    - id: agent-loop
      name: '@liusiqi-dev/sqh-agent-loop'
      disabled: false
      config:
        agents: []

    - id: persistent-bash
      name: '@liusiqi-dev/sqh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: persistent-pwsh
      name: '@liusiqi-dev/sqh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

    - id: sessions
      name: '@liusiqi-dev/sqh-session-persistence-jsonl'
      disabled: false
      config:
        root: !!js sqhHomePath('sessions')
        compression: none
