# TypeScript SDK snapshot patch for foreground and background SQH SDK failures.

- id: skill-filesystem
  name: '@liusiqi-dev/sqh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@liusiqi-dev/sqh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@liusiqi-dev/sqh-session-persistence-jsonl'
  config:
    root: !!js sqhHomePath('sessions')
    compression: !!js "process.env.SQODE_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-log-deepseek
  name: '@liusiqi-dev/sqh-session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: subagent-sdk-diagnostic
      name: '@liusiqi-dev/sqh-subagent-sdk'
      config:
        providerName: sqhsdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.SQODE_TEST_CHILD_PATCH
        sqhHome: !!js sqhHomePath('children/foreground')
        provider: mock
        model: mock-echo
        env:
          SQODE_TELEMETRY_DISABLED: '1'
          SQODE_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-sdk-diagnostic
      name: '@liusiqi-dev/sqh-tool-subagent'
      config:
        provider: sqhsdk-diagnostic
        toolName: subagent_dsh_sdk
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: subagent-sdk-diagnostic-background
      name: '@liusiqi-dev/sqh-subagent-sdk'
      config:
        providerName: sqhsdk-diagnostic-background
        profile: sdk
        patches:
          - !!js process.env.SQODE_TEST_CHILD_PATCH
        sqhHome: !!js sqhHomePath('children/background')
        provider: mock
        model: mock-echo
        env:
          SQODE_TELEMETRY_DISABLED: '1'
          SQODE_TEST_CHILD_FAILURE: '1'
          FAKE_INIT_GO: .dsh-sdk-background-release
    - id: tool-subagent-sdk-diagnostic-background
      name: '@liusiqi-dev/sqh-tool-subagent'
      config:
        provider: sqhsdk-diagnostic-background
        toolName: subagent_dsh_sdk_background
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: release-sqhsdk-background-on-job-output
      name: '../../../apps/cli/tests/profiles/sdk/fixtures/subagent-sdk-release-on-job-output.ts'
