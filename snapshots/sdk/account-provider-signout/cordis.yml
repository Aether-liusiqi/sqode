# TypeScript SDK snapshot-record patch over `dsh --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@liusiqi-dev/sqh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek-account
  name: '@liusiqi-dev/sqh-llm-deepseek-account'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@liusiqi-dev/sqh-session-persistence-jsonl'
  config:
    root: !!js sqhHomePath('sessions')
    compression: !!js "process.env.SQODE_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@liusiqi-dev/sqh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- insert:
    - id: account-signout-fixture
      name: './account-signout.mjs'
