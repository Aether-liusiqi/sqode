- insert:
    - id: mcp-resource-catalog
      name: '@liusiqi-dev/dsh-mcp-client'
      config:
        transport: stdio
        serverName: catalog
        command: !!js process.execPath
        args: !!js '[process.env.SQODE_MCP_RESOURCES_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false
