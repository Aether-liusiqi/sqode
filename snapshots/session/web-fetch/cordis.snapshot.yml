# Keyless replay counterpart: deterministic HTTP remains real; only the model
# adapter is replaced by replay.
- id: llm-deepseek
  name: '@liusiqi-dev/sqh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@liusiqi-dev/sqh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: web-fetch-fixture
      name: './web-fetch-fixture-server.mjs'

- id: web
  name: '@liusiqi-dev/sqh-web'

- id: web-fetch-http
  name: '@liusiqi-dev/sqh-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@liusiqi-dev/sqh-tool-web'
  config:
    search: false
