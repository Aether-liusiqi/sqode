# Keyless replay counterpart: the failed search remains real; only the
# conversation model adapter is replaced by replay.
- id: llm-deepseek
  name: '@liusiqi-dev/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@liusiqi-dev/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro

    - id: web-search-error-fixture
      name: './web-search-error-fixture.mjs'

- id: web-search-deepseek
  name: '@liusiqi-dev/dsh-web-search-deepseek'
  config:
    apiKey: snapshot-key
    # The fixture maps this recorded authority to its OS-assigned listener.
    baseURL: http://127.0.0.1:43118/anthropic/v1

# This scenario exists to show the guidance for a search route that cannot reach
# its endpoint, so it has to use the fixture-backed route. The shipped default is a
# keyless engine route, which would answer from the live network and make the
# recorded exchange depend on what a search engine returns during that minute.
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http
