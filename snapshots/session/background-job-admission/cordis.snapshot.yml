# Keyless counterpart to background-job-admission.cordis.yml: replace the
# DeepSeek adapter with replay while preserving the app's one-task admission
# config and the recorded flash route.
- id: llm-deepseek
  name: '@liusiqi-dev/sqh-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@liusiqi-dev/sqh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@liusiqi-dev/sqh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@liusiqi-dev/sqh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@liusiqi-dev/sqh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: jobs
  name: '@liusiqi-dev/sqh-jobs-local'
  config:
    maxConcurrentJobsPerOwner: 1

- insert:
    - id: llm-replay
      name: '@liusiqi-dev/sqh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
