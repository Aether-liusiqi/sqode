# Minimal live counterpart for the persistent-pwsh-padded-completion snapshot composition.
- id: llm-deepseek
  name: '@liusiqi-dev/sqh-llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@liusiqi-dev/sqh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@liusiqi-dev/sqh-subprocess-local'

- insert:
    - id: terminal
      name: '@liusiqi-dev/sqh-terminal'

- insert:
    - id: padded-pwsh-backend
      name: './pwsh-snapshot-backend.mjs'

- id: agent-default-model
  name: '@liusiqi-dev/sqh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@liusiqi-dev/sqh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.SQODE_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@liusiqi-dev/sqh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@liusiqi-dev/sqh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@liusiqi-dev/sqh-tool-jobs'
  disabled: true

- id: goal
  name: '@liusiqi-dev/sqh-goal'
  disabled: true

- id: goal-round-driver
  name: '@liusiqi-dev/sqh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@liusiqi-dev/sqh-command-goal'
  disabled: true

- id: tool-goal
  name: '@liusiqi-dev/sqh-tool-goal'
  disabled: true

- id: skill
  name: '@liusiqi-dev/sqh-skill'
  disabled: true

- id: skill-filesystem
  name: '@liusiqi-dev/sqh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@liusiqi-dev/sqh-tool-skill'
  disabled: true

- id: tool-bash
  name: '@liusiqi-dev/sqh-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@liusiqi-dev/sqh-tool-pwsh-persistent'
