- id: agent-default-model
  name: '@liusiqi-dev/sqh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@liusiqi-dev/sqh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.SQODE_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@liusiqi-dev/sqh-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@liusiqi-dev/sqh-tools'
  config:
    mode: both

- id: system-prompt
  name: '@liusiqi-dev/sqh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@liusiqi-dev/sqh-cordis-host-runner'
      config:
        clientInspectTimeoutMs: 100
    - id: cordis-inspect-providers
      name: '@liusiqi-dev/sqh-tool-cordis/host'
    - id: tool-cordis
      name: '@liusiqi-dev/sqh-tool-cordis'
    - id: client-inspect-liveness-fixture
      name: ./client-fixture.mjs
